# Publication of the coverage report on GitHub Pages, on every integration into dev.
#
# The report already exists as an artifact, but an artifact has to be downloaded and unzipped.
# Published, it opens in one click and can be cited in review. The API documentation of EN-44 (#45)
# is published on the same site, under /api/.

name: pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time, without cancelling the one in progress: interrupting a Pages deployment
# leaves the site in an undetermined state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Produire le rapport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Executer les tests avec couverture
        run: npm test

      - name: Ajouter une page d accueil
        run: |
          set -euo pipefail
          cat > coverage/index-site.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Legacy 22 — qualité</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            body { font: 16px/1.6 system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
            a { color: #0969da; }
          </style>
          <h1>Legacy 22 — qualité</h1>
          <p>Rapports produits à chaque intégration sur <code>dev</code>.</p>
          <ul>
            <li><a href="./index.html">Rapport de couverture</a></li>
            <li><a href="./api/">Documentation de l'API</a> (<a href="./api/openapi.json">OpenAPI 3.1</a>)</li>
          </ul>
          HTML
          mv coverage/index-site.html coverage/accueil.html

      # The versioned document, not a generation made here: the tests have just checked that it is
      # exactly the one the code produces. Redoc is pinned and its hash checked by the browser, so a
      # silent change on the CDN would not run.
      - name: Ajouter la documentation d API
        run: |
          set -euo pipefail
          mkdir -p coverage/api
          cp docs/api/openapi.json coverage/api/openapi.json
          cat > coverage/api/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Legacy 22 — API</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <redoc spec-url="./openapi.json"></redoc>
          <script src="https://cdn.jsdelivr.net/npm/redoc@2.5.4/bundles/redoc.standalone.js"
                  integrity="sha384-w447zOpYfw/1Tv/5AK9NfHTlQIqE3RVR6KY62jCyy9zNDgO64cMwGGP1Fj0zJVf5"
                  crossorigin="anonymous"></script>
          HTML

      - uses: actions/upload-pages-artifact@v5
        with:
          path: coverage

  publier:
    name: Publier sur Pages
    runs-on: ubuntu-latest
    needs: construire
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
