# Static security analysis. Free on a public repository, it complements the EN-17 quality gate: that
# one measures code quality, this one looks for known vulnerabilities.
#
# It runs on pull requests and once a week: a vulnerability published after the code was written
# would never show up without a periodic run.

name: codeql

on:
  pull_request:
  push:
    branches: [dev]
  schedule:
    # Monday morning, before the daily: the results are there when the team arrives.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  analyser:
    name: Analyse CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-and-quality adds maintainability rules that would duplicate ESLint. We keep the
          # security set alone, so that each tool has a distinct role.
          queries: security-extended

      - name: Analyser
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
