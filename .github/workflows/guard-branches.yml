# Guard of the integrated branches.
#
# The repository is private on a free plan: neither branch protection nor rulesets are available,
# nothing can refuse a direct push. This workflow does not prevent it, it makes it visible and
# traced. A bypass leaves a red run and an issue opened in its author's name.
#
# Two invariants, checked differently: dev only receives commits coming from a pull request that
# targets it; main only receives content already present in dev. That is the real invariant:
# inspecting the source branch of a pull request is fragile, a commit can belong to several pull
# requests. We therefore check that the commit is an ancestor of dev, which is true of a delivery
# and false of any shortcut.
#
# To be removed the day a server rule becomes available.

name: guard-branches

on:
  push:
    branches: [main, dev]

# The workflow token only has the rights declared here. Listing the pull requests associated with a
# commit falls under pull-requests, not contents: without this line, the call answers 403 and the
# guard checks nothing.
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  verifier-origine:
    name: Origine du commit
    # Creating or deleting a branch is not a content push: there is nothing to check, and the commit
    # already belongs to an existing branch.
    if: github.event.created == false && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Verifier l invariant de la branche
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branche="${GITHUB_REF_NAME}"
          echo "branche=$branche" >> "$GITHUB_OUTPUT"

          if [ "$branche" = "main" ]; then
            # Everything that arrives on main must already exist in dev.
            #
            # A delivery is a merge commit: it does not itself exist in dev, but its second parent
            # is the head of dev at the time of the merge. That parent is therefore the one to
            # compare. Comparing the merge commit would flag every delivery as a bypass, and a guard
            # that cries wolf ends up ignored.
            parents="$(gh api "repos/$DEPOT/commits/$SHA" --jq '[.parents[].sha] | join(" ")')"
            candidat="$SHA"
            if [ "$(printf '%s' "$parents" | wc -w | tr -d ' ')" -ge 2 ]; then
              candidat="$(printf '%s' "$parents" | awk '{print $2}')"
              echo "Commit de fusion : comparaison sur son second parent $candidat."
            fi

            if ! cmp="$(gh api "repos/$DEPOT/compare/dev...$candidat" --jq .status 2>&1)"; then
              echo "::error::Comparaison avec dev impossible : $cmp"
              exit 1
            fi
            case "$cmp" in
              identical|behind)
                echo "raison=" >> "$GITHUB_OUTPUT"
                echo "Origine conforme : le commit est deja present dans dev ($cmp)." ;;
              *)
                echo "raison=Le commit est arrive sur \`main\` sans passer par \`dev\` (comparaison : $cmp). Seule une livraison depuis \`dev\` peut atteindre \`main\`." >> "$GITHUB_OUTPUT"
                echo "::error::main a recu du contenu absent de dev (comparaison : $cmp)." ;;
            esac
            exit 0
          fi

          # dev: at least one closed pull request on this branch must contain the commit.
          if ! json="$(gh api "repos/$DEPOT/commits/$SHA/pulls" 2>&1)"; then
            echo "::error::Impossible d interroger l API des pull requests : $json"
            echo "Verifier le bloc permissions du workflow." >&2
            exit 1
          fi
          count="$(printf '%s' "$json" | jq '[.[] | select(.base.ref == "dev")] | length')"
          if [ "$count" -gt 0 ]; then
            echo "raison=" >> "$GITHUB_OUTPUT"
            echo "Origine conforme : pull request vers dev."
          else
            echo "raison=Commit pousse directement sur \`dev\`, sans pull request." >> "$GITHUB_OUTPUT"
            echo "::error::Commit pousse directement sur dev, sans pull request."
          fi

      - name: Ouvrir une issue de suivi
        if: steps.pr.outputs.raison != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          RAISON: ${{ steps.pr.outputs.raison }}
          BRANCHE: ${{ steps.pr.outputs.branche }}
          ACTEUR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The content goes through environment variables rather than direct interpolation: a
          # commit message containing quotes would break the command, and could inject shell into
          # it.
          {
            printf '%s\n\n' "$RAISON"
            printf 'Commit : %s\n' "$SHA"
            printf 'Auteur du push : @%s\n' "$ACTEUR"
            printf 'Message : %s\n\n' "${MESSAGE%%$'\n'*}"
            printf 'Le flux attendu est : branche de travail, puis pull request vers dev, puis livraison de dev vers main.\n\n'
            printf 'Le depot etant prive sur un plan gratuit, aucune regle serveur ne peut refuser ce push. La convention repose sur le hook pre-push local et sur cette detection.\n\n'
            printf 'A faire :\n'
            printf -- '- [ ] Expliquer pourquoi le flux a ete contourne\n'
            printf -- '- [ ] Verifier que le hook local est installe, avec le script d installation de l equipe\n'
            printf -- '- [ ] Si le changement doit etre revu, ouvrir une pull request de suivi\n'
          } > corps-issue.md
          gh issue create \
            --repo "$DEPOT" \
            --title "Convention de branche contournee sur $BRANCHE : ${SHA:0:7}" \
            --body-file corps-issue.md
      - name: Echouer
        if: steps.pr.outputs.raison != ''
        run: exit 1
