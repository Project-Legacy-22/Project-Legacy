# Applies the merged migrations to the hosted Supabase database.
#
# Production and previews share a single hosted project. On 23 September 2026, six migrations merged
# on dev had never been applied there: the code of #382 read a missing column and the previews
# answered 500 (#385). Nobody had to do it, so nobody had done it.
#
# Triggered after a green ci run on dev, and only that one: ci already replays every migration on an
# empty database, so a migration that arrives here has already been applied once elsewhere. Replays
# without effect when the database is up to date: the dry run then lists nothing and the application
# does nothing.
#
# The database being shared, a migration reaches production before the code that uses it: it must
# stay additive and compatible with the code already delivered. The rule and its reason are in
# docs/ci.md.

name: migrations

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two concurrent applications would fight over the migration history table. We wait for the
  # previous one, we never cancel it.
  group: migrations-hebergees
  cancel-in-progress: false

jobs:
  appliquer:
    name: Appliquer les migrations a la base hebergee
    # A red ci run pushes nothing; a manual trigger starts from dev, which has already passed ci to
    # get in.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Verifier que la cible est configuree
        run: |
          set -euo pipefail
          manquants=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || manquants+=("secret SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || manquants+=("variable SUPABASE_PROJECT_REF")
          if [ ${#manquants[@]} -gt 0 ]; then
            echo "::error::Configuration absente : ${manquants[*]}. Voir docs/ci.md, section Migrations de la base hebergee."
            exit 1
          fi

      # The commit ci checked, not the head of dev when this workflow starts: a merge that arrived
      # in between has not been checked yet.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # The CLI reads SUPABASE_ACCESS_TOKEN and, if set, SUPABASE_DB_PASSWORD from the environment:
      # nothing goes as an argument, where it would be visible to every process of the runner.
      # Without a password, the token is enough: the CLI opens a temporary login role for the
      # duration of the command (#392).
      - name: Lier le projet heberge
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Lister ce qui va partir
        run: |
          set -euo pipefail
          {
            echo "## Migrations de la base hebergee"
            echo
            echo '```'
            npx supabase db push --dry-run 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --yes: without a terminal, the CLI's confirmation has nobody to talk to. What goes was
      # listed at the previous step.
      - name: Appliquer
        run: npx supabase db push --yes
