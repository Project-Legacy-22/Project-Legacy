# Checks run on every pull request to dev and on every push to dev. Also callable by another
# workflow (workflow_call), which the image publication uses: it does not republish the checks, it
# reuses them, so that an image cannot be published without them.
#
# The order of the jobs is not cosmetic. Typed linting needs the TypeScript projects to be built:
# without a prior `tsc --build` it reports hundreds of resolution errors. `typecheck` builds, so it
# goes first, and its failure saves paying for the tests.

name: ci

on:
  # Every pull request is checked, whatever its target. Filtering on dev would leave a pull request
  # stacked on another one without any check, which is precisely when one needs it most.
  pull_request:
  push:
    branches: [dev]
  workflow_call:

# The token only has the rights declared here. No job writes to the repository.
permissions:
  contents: read

# A push to a branch cancels the previous run of the same branch. With six people, without this, the
# queue grows and the monthly Actions quota goes on runs that are already stale. Never on dev: every
# integrated commit must have been checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Reduces npm's noise in the logs without hiding the errors.
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  verifier:
    name: Types et style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier les types et les frontieres de couches
        run: npm run typecheck

      - name: Analyser le style
        run: npm run lint

  tester:
    name: Tests et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verifier
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # The integration tests (EN-25) run in their own job: they need the local Supabase stack,
      # which this job has no reason to pay for npm test, run on every change.
      - name: Executer les tests
        run: npm test

      # Without required checks, which the repository's plan does not allow, the summary is what
      # makes the verdict readable from the pull request without opening the logs.
      - name: Publier le resume de couverture
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Couverture'
            echo
            if [ -f coverage/coverage-summary.json ]; then
              node --input-type=module -e "
                import { readFileSync } from 'node:fs';
                const total = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8')).total;
                console.log('| Mesure | Couvert | Total | % |');
                console.log('|---|---|---|---|');
                // branchesTrue is an internal v8 measure, of no interest here.
                for (const nom of ['lines', 'statements', 'functions', 'branches']) {
                  const valeur = total[nom];
                  console.log(\`| \${nom} | \${valeur.covered} | \${valeur.total} | \${valeur.pct} % |\`);
                }
              "
            else
              echo 'Aucun rapport produit : les tests ont echoue avant la mesure.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le rapport detaille
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Tests d integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verifier
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # Also applies the migrations: the CLI, not this job, knows how to replay them in the order
      # the stack it starts expects.
      - name: Demarrer la pile Supabase locale
        run: npx supabase start

      # The application requires the broker at start-up: without it, it would fill an outbox nobody
      # empties, and it is better that it refuses to start than to find out in production. The
      # integration tests compose a real application, so they need the same service. Same
      # declaration as local development, so that the two environments do not diverge.
      - name: Demarrer le broker
        run: docker compose up -d --wait redis

      # The CLI prints API_URL / SERVICE_ROLE_KEY / ANON_KEY (format `KEY="value"`); scripts/up.mjs
      # does the same reading for local development. Written to GITHUB_ENV, the next steps of the
      # job receive them without any secret being printed: they are local keys, generated for this
      # ephemeral stack.
      - name: Lire les coordonnees de la pile
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            valeur="${value%\"}"; valeur="${valeur#\"}"
            case "$key" in
              API_URL) echo "SUPABASE_URL=$valeur" >> "$GITHUB_ENV" ;;
              SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$valeur" >> "$GITHUB_ENV" ;;
              ANON_KEY) echo "SUPABASE_ANON_KEY=$valeur" >> "$GITHUB_ENV" ;;
            esac
          done < <(npx supabase status -o env)
          # The broker is published on the loopback by compose.yaml, on the default port: no other
          # Redis runs on a runner.
          echo "REDIS_URL=redis://127.0.0.1:6379" >> "$GITHUB_ENV"

      - name: Executer les tests d integration
        run: |
          set -euo pipefail
          debut=$(date +%s)
          npm run test:integration
          duree=$(( $(date +%s) - debut ))
          echo "## Tests d integration" >> "$GITHUB_STEP_SUMMARY"
          echo "Duree : ${duree}s" >> "$GITHUB_STEP_SUMMARY"

  migration:
    name: Migration de donnees
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verifier
    # Only on the delivery path: the pull request from dev to main, and the push to main that
    # follows it. The suite starts three engines and replays both directions of the migration;
    # running it on every pull request would cost each one a minute and a half to check code that
    # almost never changes. A delivery, on the other hand, is exactly when reversibility must be
    # proven.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # `npm run test:migration` starts the containers itself. The step is separate so that the log
      # tells an engine that does not start from a test that fails.
      - name: Demarrer les trois moteurs
        run: docker compose --profile migration up -d --wait

      - name: Eprouver la migration dans les deux sens
        run: |
          set -euo pipefail
          debut=$(date +%s)
          npx vitest run --config vitest.migration.config.ts
          duree=$(( $(date +%s) - debut ))
          echo "## Migration de donnees" >> "$GITHUB_STEP_SUMMARY"
          echo "Les deux sens eprouves sur PostgreSQL, MySQL et SQLite." >> "$GITHUB_STEP_SUMMARY"
          echo "Duree : ${duree}s" >> "$GITHUB_STEP_SUMMARY"

      # The engines keep no volume, but a reused runner may keep the containers: stopping them keeps
      # a run from inheriting the state of the previous one.
      - name: Arreter les moteurs
        if: always()
        run: docker compose --profile migration down

  qualite:
    name: Qualite (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tester
    steps:
      - uses: actions/checkout@v7
        with:
          # A shallow clone would degrade the relevance of the analysis (blame, comparison of the
          # pull request diff).
          fetch-depth: 0

      - name: Recuperer le rapport de couverture
        uses: actions/download-artifact@v7
        with:
          name: couverture
          path: coverage/

      # sonar-project.properties holds the configuration: organisation, project key, sources, and
      # the path to the coverage/lcov.info fetched above. The applied gate ("Sonar way", thresholds
      # documented in the matching ADR) is imposed by the organisation's free plan: no custom gate
      # can be selected on it.
      #
      # sonar.qualitygate.wait waits for the gate's verdict and returns a non-zero exit code when it
      # fails. Without it, this job only reported a failure of the scan: the gate itself was only
      # blocking through the check SonarCloud publishes on its side, and that check never appears on
      # a Dependabot pull request. Making it blocking here makes it blocking everywhere, and stops
      # depending on an external context.
      #
      # The condition is on the step and not on the job. Skipping the whole job makes it conclude as
      # "skipped", and a required check that is skipped is not satisfied by GitHub: the pull request
      # would go from red to blocked. Not on a push to main. The gate has already given its verdict,
      # blocking, on the pull request that produced this merge commit: replaying it on the result
      # brings no new judgement. And the organisation's free offer only analyses the declared main
      # branch, so the gate request answers "Not authorized or project not found" there -- which
      # made the image publication run fail, and skipped the publication, since the analysis started
      # receiving its token.
      - name: Analyser avec SonarCloud
        if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Dependabot reads a separate secrets store, where the token in place is refused by
      # SonarCloud. Rather than leave a red job nobody can fix from a bot pull request, we say why
      # the analysis did not run. These changes are still judged by their tests, their build and
      # CodeQL.
      - name: Dire pourquoi l analyse n a pas tourne sur la livraison
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## Qualite" >> "$GITHUB_STEP_SUMMARY"
          echo "Analyse non executee : le gate a deja statue sur la pull request de livraison." >> "$GITHUB_STEP_SUMMARY"

      - name: Dire pourquoi l analyse n a pas tourne
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "## Qualite" >> "$GITHUB_STEP_SUMMARY"
          echo "Analyse non executee : le jeton du magasin Dependabot est refuse par SonarCloud." >> "$GITHUB_STEP_SUMMARY"
          echo "Le changement reste juge sur ses tests, son build et CodeQL." >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Audit des dependances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verifier
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # The global env sets npm_config_audit to false to silence the automatic audit of npm ci; it
      # is turned back on here, for the explicit command. --audit-level=high: a high or critical
      # vulnerability fails the job and therefore the merge (standards/07-quality-gates.md section
      # 5). Lower levels are reported without blocking.
      - name: Auditer les dependances
        run: npm audit --audit-level=high
        env:
          npm_config_audit: 'true'

  construire:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verifier
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Construire l API et le front
        run: npm run build

      # The front is written by Vite into the API output: if it is not, the published image would
      # serve an empty page without anything failing.
      - name: Verifier que le front est bien dans la sortie de l API
        run: test -f apps/api/dist/static/index.html

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verifier
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built on every pull request, never published here. Building it only at delivery time would
      # let a broken Dockerfile go unnoticed until the next release.
      - name: Construire l image sans la publier
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: legacy-todo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The full HTTP smoke test needs a reachable Supabase backend: since EN-09 the API probes the
      # database at start-up and stops if it is missing (a deliberate choice, apps/api/src/config.ts
      # and composition-root.ts). As long as the local Supabase stack is not started in CI --
      # planned with EN-25, see ADR-0004, which reserves that Actions cost for real integration
      # tests -- this job builds the image and checks its shape. The database job below exercises
      # the migrations. Restoring the smoke test is tracked by #114.
      - name: Verifier que l image est bien formee et demarrable
        run: |
          set -euo pipefail
          conteneur="$(docker create legacy-todo:ci)"
          docker rm "$conteneur" >/dev/null
          commande="$(docker image inspect legacy-todo:ci --format '{{json .Config.Cmd}}')"
          echo "Commande de l image : $commande"
          echo "$commande" | grep -q 'apps/api/dist/index.js'

      - name: Verifier qu elle ne tourne pas en root
        run: |
          set -euo pipefail
          utilisateur="$(docker image inspect legacy-todo:ci --format '{{.Config.User}}')"
          if [ -z "$utilisateur" ] || [ "$utilisateur" = "root" ]; then
            echo "::error::L image tourne en root (utilisateur : '$utilisateur')."
            exit 1
          fi
          echo "Utilisateur de l image : $utilisateur"

  base-de-donnees:
    name: Migrations et schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verifier
    # A bare PostgreSQL, not the Supabase stack: the point checked is that the migrations apply from
    # an empty database and produce the expected schema. The migration SQL is standard PostgreSQL,
    # it needs neither PostgREST nor authentication to be exercised. Starting the full stack is
    # reserved for the integration tests (EN-25, ADR-0004).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7

      # Since US-11 the migrations depend on Supabase's auth schema: the mirror of auth.users and
      # the policies that call auth.uid() (ADR-0008). A bare PostgreSQL does not have it. We set
      # here the bare minimum the migrations need, not an imitation of GoTrue: the provider's
      # behaviour is not exercised in this job. The day this facsimile is no longer enough, the job
      # must start the Supabase stack, which ADR-0004 reserves for the integration tests (EN-25).
      - name: Poser le schema auth minimal attendu par les migrations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          -- raw_user_meta_data carries the consent the mirror reads since 20260910110000. The
          -- facsimile did without it as long as no check inserted into auth.users; the erasure
          -- assertions of US-16 do, and the trigger then failed on a missing column.
          create table if not exists auth.users (
            id uuid primary key,
            email text,
            raw_user_meta_data jsonb
          );
          create or replace function auth.uid() returns uuid
          language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          -- The three roles Supabase provides, not only the one today's migrations use. A migration
          -- that grants rights to anon or service_role is valid on a real project; creating only
          -- authenticated made it fail here on "role does not exist", that is on a gap of the CI
          -- and not on a mistake.
          do $$
          declare
            role_name text;
          begin
            foreach role_name in array array['anon', 'authenticated', 'service_role'] loop
              if not exists (select from pg_roles where rolname = role_name) then
                execute format('create role %I', role_name);
              end if;
            end loop;
          end
          $$;
          SQL

      # Lexical order = order of application, as the Supabase CLI does. ON_ERROR_STOP fails the job
      # on the first rejected statement.
      - name: Appliquer les migrations sur une base vide
        run: |
          set -euo pipefail
          shopt -s nullglob
          fichiers=(supabase/migrations/*.sql)
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "::error::Aucune migration dans supabase/migrations."
            exit 1
          fi
          for f in "${fichiers[@]}"; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verifier les garanties structurelles du schema
        run: psql -v ON_ERROR_STOP=1 -f scripts/check-schema.sql
