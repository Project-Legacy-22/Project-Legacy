# Publication of the image to GitHub Container Registry, on every delivery to main.
#
# The checks are not rewritten here: the ci workflow is called as it is. An image therefore cannot
# be published without them, by construction and not by convention.

name: image

on:
  push:
    branches: [main]
  # Makes it possible to republish an image without a new commit, for instance after a registry fix.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: Verifications
    uses: ./.github/workflows/ci.yml
    # A called workflow receives no secret from the calling workflow without this line, and the
    # SonarCloud analysis reads one. Without it, the scanner receives an empty token, answers "Not
    # authorized or project not found" and fails the run: the delivery of 10 September therefore
    # published neither an image nor a release. The symptom did not show on a pull request, where
    # ci.yml runs as a workflow in its own right and has access to the repository's secrets.
    #
    # inherit rather than a named passing: ci.yml will read others, and a named list would bring
    # back the same oversight with the next secret added.
    secrets: inherit

  publier:
    name: Publier sur GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verifier
    permissions:
      # write, and not read: the publication also creates a release.
      contents: write
      packages: write
      # Necessaires a l attestation de provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: S authentifier aupres du registre
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The OCI labels link the image to its source, its licence and its build date. The sha-<short>
      # tag is the one cited in review: it leads back to the exact commit.
      - name: Calculer les tags et les etiquettes
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Legacy 22
            org.opencontainers.image.description=API et interface Kanban servies sur le meme port

      - name: Construire et publier
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The cache is shared with the image job of ci: the image was already built on the pull
          # request, only the changed layers are rebuilt here.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Links the image to the commit and the workflow that produced it, in a verifiable way. Its
      # availability depends on the account's plan: its failure must not prevent an otherwise valid
      # publication, but it is visible in the run and tracked by issue #92.
      - name: Attester la provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # One release per delivery: it gives a reference point cited in review, and its notes list the
      # delivered items without manual work.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)-$(echo "${{ github.sha }}" | cut -c1-7)"
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes \
            --notes-start-tag "$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')" \
            || gh release create "$tag" --target "${{ github.sha }}" --title "$tag" --generate-notes
          {
            echo '## Release'
            echo
            echo "Tag : \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumer la publication
        run: |
          set -euo pipefail
          {
            echo '## Image publiee'
            echo
            echo '| Champ | Valeur |'
            echo '|---|---|'
            echo "| Registre | ghcr.io/${{ github.repository }} |"
            echo "| Empreinte | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Commit | ${{ github.sha }} |"
            echo
            echo '### Executer cette image'
            echo
            echo '```bash'
            echo "docker run --rm -p 3000:3000 \\\\"
            echo "  -e SQLITE_DB_LOCATION=/tmp/todo.db \\\\"
            echo "  ghcr.io/${{ github.repository }}:sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
