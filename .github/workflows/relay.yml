# Fait tourner le relais de l outbox sur le deploiement, toutes les trente
# secondes.
#
# Vercel n a pas de processus qui tourne entre deux requetes, donc personne n y
# fait tourner le relais. Les crons Vercel en offre gratuite sont limites a une
# fois par jour, et GitHub refuse un cron sous cinq minutes sans meme tenir
# celui-la : le 24 septembre, les passes planifiees ont eu lieu a 21:41, 23:58,
# 03:39 et 08:44 (#410). Un job reste donc actif pres de six heures et declenche
# une passe toutes les trente secondes (scripts/relay-loop.mjs), puis lance son
# successeur. Le cron ne sert plus qu a relancer la chaine si elle s arrete.
#
# Le depot est public : les minutes des runners heberges ne sont pas comptees.

name: relais

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      relance:
        description: Lance par la boucle precedente, qui se termine
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  garde:
    name: Boucle deja active
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      demarrer: ${{ steps.verifier.outputs.demarrer }}
    steps:
      # Une boucle qui tourne deja declenche une passe dans les trente
      # secondes : en demarrer une seconde n apporterait rien. La relance faite
      # par la boucle sortante passe outre, puisque cette boucle-la est encore
      # en cours au moment ou elle demande sa successeure.
      - name: Verifier
        id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
          RELANCE: ${{ inputs.relance }}
        run: |
          if [ "$RELANCE" = "true" ]; then
            echo "demarrer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          actives=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/relay.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\" or .status == \"waiting\"))] | length")

          if [ "$actives" -gt 0 ]; then
            echo "::notice::une boucle de livraison tourne deja"
            echo "demarrer=false" >> "$GITHUB_OUTPUT"
          else
            echo "demarrer=true" >> "$GITHUB_OUTPUT"
          fi

  boucle:
    name: Passe de livraison toutes les 30 secondes
    needs: garde
    if: needs.garde.outputs.demarrer == 'true'
    runs-on: ubuntu-latest
    # La boucle dure 345 minutes ; GitHub arrete un job a 360.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    concurrency:
      # Une boucle a la fois : deux passes concurrentes liraient les memes
      # lignes non publiees et les publieraient deux fois. La successeure
      # attend ici que la boucle sortante se termine.
      group: relais
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Les mesures partent de la boucle, sommees toutes les dix passes, et non
      # d une campagne a part : un second declencheur de passe rouvrirait la
      # course que le groupe de concurrence ferme.
      - name: Livrer
        id: boucle
        env:
          TARGET: ${{ vars.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          GRAFANA_PUSH_URL: ${{ vars.GRAFANA_PUSH_URL }}
          GRAFANA_PUSH_USER: ${{ vars.GRAFANA_PUSH_USER }}
          GRAFANA_PUSH_TOKEN: ${{ secrets.GRAFANA_PUSH_TOKEN }}
        run: node scripts/relay-loop.mjs

      # Le GITHUB_TOKEN ne declenche aucun workflow, sauf workflow_dispatch.
      # Seule une boucle allee a son terme relance : une boucle arretee net
      # (variable absente) se relancerait sinon aussi vite que GitHub file.
      - name: Relancer la boucle
        if: steps.boucle.outputs.relancer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run relay.yml --ref "$GITHUB_REF_NAME" -f relance=true
