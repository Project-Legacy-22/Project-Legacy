# Runs the outbox relay on the deployment, every thirty seconds.
#
# Vercel has no process running between two requests, so nobody runs the relay there. Vercel crons
# on the free plan are limited to once a day, and GitHub refuses a cron under five minutes without
# even keeping to that one: on 24 September, the scheduled passes took place at 21:41, 23:58, 03:39
# and 08:44 (#410). A job therefore stays active for nearly six hours and triggers a pass every
# thirty seconds (scripts/relay-loop.mjs), then starts its successor. The cron now only serves to
# restart the chain if it stops.
#
# The repository is public: the minutes of hosted runners are not counted.

name: relais

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      relance:
        description: Lance par la boucle precedente, qui se termine
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  garde:
    name: Boucle deja active
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      demarrer: ${{ steps.verifier.outputs.demarrer }}
    steps:
      # A loop already running triggers a pass within thirty seconds: starting a second one would
      # bring nothing. The restart made by the outgoing loop goes past this check, since that loop
      # is still running when it asks for its successor.
      - name: Verifier
        id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
          RELANCE: ${{ inputs.relance }}
        run: |
          if [ "$RELANCE" = "true" ]; then
            echo "demarrer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          actives=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/relay.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"pending\" or .status == \"waiting\"))] | length")

          if [ "$actives" -gt 0 ]; then
            echo "::notice::une boucle de livraison tourne deja"
            echo "demarrer=false" >> "$GITHUB_OUTPUT"
          else
            echo "demarrer=true" >> "$GITHUB_OUTPUT"
          fi

  boucle:
    name: Passe de livraison toutes les 30 secondes
    needs: garde
    if: needs.garde.outputs.demarrer == 'true'
    runs-on: ubuntu-latest
    # The loop lasts 345 minutes; GitHub stops a job at 360.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    concurrency:
      # One loop at a time: two concurrent passes would read the same unpublished rows and publish
      # them twice. The successor waits here for the outgoing loop to finish.
      group: relais
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The measurements leave from the loop, summed every ten passes, and not from a separate run:
      # a second pass trigger would reopen the race the concurrency group closes.
      - name: Livrer
        id: boucle
        env:
          TARGET: ${{ vars.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          GRAFANA_PUSH_URL: ${{ vars.GRAFANA_PUSH_URL }}
          GRAFANA_PUSH_USER: ${{ vars.GRAFANA_PUSH_USER }}
          GRAFANA_PUSH_TOKEN: ${{ secrets.GRAFANA_PUSH_TOKEN }}
        run: node scripts/relay-loop.mjs

      # The GITHUB_TOKEN triggers no workflow, except workflow_dispatch. Only a loop that ran to its
      # end restarts: a loop stopped short (missing variable) would otherwise restart as fast as
      # GitHub queues.
      - name: Relancer la boucle
        if: steps.boucle.outputs.relancer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run relay.yml --ref "$GITHUB_REF_NAME" -f relance=true
