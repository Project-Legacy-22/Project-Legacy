# Declenche une passe de livraison sur le deploiement.
#
# Vercel n a pas de processus qui tourne entre deux requetes, donc personne n y
# fait tourner le relais de l outbox. Les crons Vercel en offre gratuite sont
# limites a une fois par jour ; ce workflow prend le relais toutes les cinq
# minutes, ce qui est le minimum que GitHub accepte.

name: relais

on:
  schedule:
    # Toutes les cinq minutes. GitHub retarde souvent l execution de quelques
    # minutes : c est la garantie de fond, pas le chemin de demonstration.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une passe a la fois : deux passes concurrentes liraient les memes lignes non
  # publiees et les publieraient deux fois.
  group: relais
  cancel-in-progress: false

jobs:
  livrer:
    name: Passe de livraison
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Declencher la passe
        id: passe
        env:
          CIBLE: ${{ vars.RELAY_URL }}
          SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          if [ -z "$CIBLE" ] || [ -z "$SECRET" ]; then
            echo "::notice::RELAY_URL ou RELAY_SECRET absent, rien a declencher."
            exit 0
          fi

          reponse=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --header "x-relay-secret: $SECRET" \
            --request POST "$CIBLE/internal/relay")

          echo "Passe: $reponse"
          echo "::notice::$reponse"
          echo "passe=$reponse" >> "$GITHUB_OUTPUT"

      # Les mesures partent d ici et non d une campagne a part, pour une raison
      # de correction : declencher une passe depuis un second cron ouvrirait la
      # course que le groupe de concurrence ci-dessus existe pour fermer -- deux
      # passes concurrentes publieraient deux fois les memes lignes. Un seul
      # cron declenche une passe, et ce qu elle rend est pousse juste apres.
      #
      # Saute proprement quand une valeur manque : une pile pas encore branchee
      # n est pas une erreur.
      - name: Pousser les mesures
        if: always() && steps.passe.outcome == 'success'
        env:
          TARGET: ${{ vars.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          GRAFANA_PUSH_URL: ${{ vars.GRAFANA_PUSH_URL }}
          GRAFANA_PUSH_USER: ${{ vars.GRAFANA_PUSH_USER }}
          GRAFANA_PUSH_TOKEN: ${{ secrets.GRAFANA_PUSH_TOKEN }}
          PASSE: ${{ steps.passe.outputs.passe }}
        run: |
          manquant=""
          for nom in TARGET RELAY_SECRET GRAFANA_PUSH_URL GRAFANA_PUSH_USER GRAFANA_PUSH_TOKEN; do
            if [ -z "${!nom}" ]; then manquant="$manquant $nom"; fi
          done

          if [ -n "$manquant" ]; then
            echo "::notice::rien a pousser, il manque :$manquant"
            exit 0
          fi

          sortie=$(node scripts/push-metrics.mjs --pass "$PASSE")
          echo "$sortie"
          echo "::notice::$sortie"
