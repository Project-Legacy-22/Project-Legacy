# Dependabot watches the dependencies and opens a pull request when an update is available or a
# vulnerability is published. It answers the npm audit point of the Definition of Done and prepares
# EN-29.
#
# Updates are grouped: six separate pull requests for six development version bumps would flood the
# board without bringing anything.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # The target is dev, like every contribution: main only receives deliveries.
    target-branch: dev
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      developpement:
        dependency-type: development
        update-types: [minor, patch]
    # A major bump changes the contract: it deserves its own pull request and its own review, never
    # a group.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: 'chore(ci)'
