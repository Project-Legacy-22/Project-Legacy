# The local composition does not fit in a single file, and that is intended: the Supabase stack
# (database, PostgREST, Studio) is orchestrated by the Supabase CLI, which manages its own
# containers and applies the migrations at start-up. Declaring those services again here would make
# them drift from what the CLI expects.
#
# This file therefore declares what the CLI does not provide: the broker chosen by ADR-0007. `npm
# run up` starts both, then the application on top.

services:
    redis:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            # Exposed on the loopback only: a broker without authentication must not be reachable
            # from the network.
            #
            # The host port can be overridden with REDIS_PORT. The default port is Redis's, but a
            # computer already running a hard-installed Redis cannot take it: without this variable,
            # the single command would fail on those computers and one would have to edit a
            # versioned file to get out of it.
            - '127.0.0.1:${REDIS_PORT:-6379}:6379'
        # Append-only log enabled: events still in the queue survive a restart. Without it, stopping
        # the computer would empty the queue, and the US-10 demonstration would lose exactly what it
        # has to show.
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    # The three engines the migration trial runs on, under a profile: `npm run up` does not start
    # them, and they cost nothing until they are asked for: `docker compose --profile migration up
    # -d --wait`, then `npm run test:migration`.
    #
    # No port is published, and that is intended: everything goes through `docker compose exec`, so
    # the trial needs neither a client installed on the computer nor a free port, and it gives the
    # same result in the integration pipeline.
    migration-postgres:
        profiles: ['migration']
        image: postgres:17-alpine
        environment:
            POSTGRES_PASSWORD: migration
        # No volume: the database is rebuilt for every trial, and a trial that starts from an
        # inherited state proves nothing.
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 3s
            timeout: 3s
            retries: 20

    migration-mysql:
        profiles: ['migration']
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: migration
        healthcheck:
            # `mysqladmin ping` answers as soon as initialisation starts, before the accounts exist:
            # a real query is the only signal that says the server accepts an authenticated
            # connection.
            test: ['CMD-SHELL', 'mysql -uroot -pmigration -e "select 1" >/dev/null 2>&1']
            interval: 3s
            timeout: 5s
            retries: 40

    migration-sqlite:
        profiles: ['migration']
        # Built from alpine rather than pulled from a third-party image: three lines of Dockerfile
        # are better than depending on someone else's image to prove our own reversibility.
        build:
            context: .
            dockerfile: docker/sqlite.Dockerfile
        healthcheck:
            test: ['CMD-SHELL', 'sqlite3 :memory: "select 1" >/dev/null']
            interval: 3s
            timeout: 3s
            retries: 10

volumes:
    # Named volume, managed by Docker: no absolute path or directory of the computer appears here,
    # and the data survives `docker compose down`.
    redis-data:
