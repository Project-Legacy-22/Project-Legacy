# La composition locale ne tient pas dans un seul fichier, et c est voulu : la
# pile Supabase (base, PostgREST, Studio) est orchestree par le CLI Supabase,
# qui gere ses propres conteneurs et applique les migrations au demarrage.
# Redeclarer ces services ici les ferait diverger de ce que le CLI attend.
#
# Ce fichier declare donc ce que le CLI ne fournit pas : le broker retenu par
# l ADR-0007. `npm run up` demarre les deux, puis l application par-dessus.

services:
    redis:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            # Expose sur la boucle locale uniquement : un broker sans
            # authentification ne doit pas etre joignable depuis le reseau.
            #
            # Le port hote se surcharge par REDIS_PORT. Le port par defaut est
            # celui de Redis, mais un poste qui fait deja tourner un Redis
            # installe en dur ne peut pas le prendre : sans cette variable, la
            # commande unique echouerait sur ces postes et il faudrait editer
            # un fichier versionne pour s en sortir.
            - '127.0.0.1:${REDIS_PORT:-6379}:6379'
        # Journal d ajout active : les evenements encore en file survivent a un
        # redemarrage. Sans lui, arreter le poste viderait la file, et la
        # demonstration de US-10 perdrait justement ce qu elle doit montrer.
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    # Les trois moteurs sur lesquels l epreuve de migration tourne, sous un
    # profil : `npm run up` ne les demarre pas, et ils ne coutent rien tant
    # qu on ne les demande pas.
    #
    #   docker compose --profile migration up -d --wait
    #   npm run test:migration
    #
    # Aucun port n est publie, et c est voulu : tout passe par
    # `docker compose exec`, donc l epreuve ne demande ni client installe sur
    # le poste ni port libre, et elle donne le meme resultat dans la chaine
    # d integration.
    migration-postgres:
        profiles: ['migration']
        image: postgres:17-alpine
        environment:
            POSTGRES_PASSWORD: migration
        # Aucun volume : la base est refaite a chaque epreuve, et une epreuve
        # qui part d un etat herite ne prouve rien.
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 3s
            timeout: 3s
            retries: 20

    migration-mysql:
        profiles: ['migration']
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: migration
        healthcheck:
            # `mysqladmin ping` repond des l initialisation, avant que les
            # comptes existent : une vraie requete est le seul signal qui dit
            # que le serveur accepte une connexion authentifiee.
            test: ['CMD-SHELL', 'mysql -uroot -pmigration -e "select 1" >/dev/null 2>&1']
            interval: 3s
            timeout: 5s
            retries: 40

    migration-sqlite:
        profiles: ['migration']
        # Construit depuis alpine plutot que tire d une image tierce : trois
        # lignes de Dockerfile valent mieux qu une dependance a l image de
        # quelqu un d autre pour prouver notre propre reversibilite.
        build:
            context: .
            dockerfile: docker/sqlite.Dockerfile
        healthcheck:
            test: ['CMD-SHELL', 'sqlite3 :memory: "select 1" >/dev/null']
            interval: 3s
            timeout: 3s
            retries: 10

volumes:
    # Volume nomme, gere par Docker : aucun chemin absolu ni repertoire du poste
    # n apparait ici, et les donnees survivent a `docker compose down`.
    redis-data:
