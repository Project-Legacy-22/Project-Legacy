# Analyse de qualite (EN-17). Le gate applique est "Sonar way", impose par le
# plan Free de SonarCloud : aucun gate personnalise n'est selectionnable sur ce
# plan (verifie a l'API, cf. l'ADR sur le choix de l'outil). Sur le nouveau
# code : couverture >= 80 %, duplication <= 3 %, notes de fiabilite, securite
# et maintenabilite = A, hotspots de securite revus = 100 %.

sonar.organization=project-legacy-22
sonar.projectKey=Project-Legacy-22_Project-Legacy

sonar.sources=apps,packages
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,apps/api/src/static/**,**/*.d.ts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Rapport produit par `npm test` (vitest, provider v8) : voir vitest.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Doit refleter la liste `coverage.exclude` de vitest.config.ts, sans quoi les
# deux outils se contredisent : vitest laisse ces fichiers hors du rapport lcov,
# Sonar ne les y trouve pas et compte leurs lignes comme non couvertes. Modifier
# une seule ligne de cablage faisait donc echouer le gate, quelle que soit la
# qualite du reste de la pull request.
#
# Les fichiers listes sont ceux que standards/03-testing.md section 7 exclut :
# composition root, points d'entree, code genere, et les adaptateurs sortants
# dont l'aller-retour ne s'exerce pas sans un vrai PostgREST ni un vrai broker.
# Leur comportement releve des tests d'integration (EN-25) ; ce que le relais et
# le consommateur decident est teste, lui, contre des faux.
sonar.coverage.exclusions=apps/api/src/composition-root.ts,apps/api/src/index.ts,apps/worker/src/index.ts,packages/data-migration/src/import-cli.ts,apps/web/src/main.tsx,packages/infra/src/database.types.ts,apps/web/src/hooks/view-state.ts,apps/web/src/hooks/items-state.ts,apps/web/src/hooks/notifications-state.ts,packages/infra/src/supabase-item-repository.ts,packages/infra/src/supabase-personal-data-store.ts,packages/infra/src/supabase-project-repository.ts,packages/infra/src/outbox-store.ts,packages/infra/src/notification-store.ts,packages/infra/src/redis-event-bus.ts,**/test/**
