# Quality analysis (EN-17). The applied gate is "Sonar way", imposed by SonarCloud's Free plan: no
# custom gate can be selected on that plan (checked through the API, see the ADR on the choice of
# the tool). On new code: coverage >= 80 %, duplication <= 3 %, reliability, security and
# maintainability ratings = A, security hotspots reviewed = 100 %.

sonar.organization=project-legacy-22
sonar.projectKey=Project-Legacy-22_Project-Legacy

sonar.sources=apps,packages
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,apps/api/src/static/**,**/*.d.ts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Report produced by `npm test` (vitest, v8 provider): see vitest.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Must mirror the `coverage.exclude` list of vitest.config.ts, otherwise the two tools contradict
# each other: vitest leaves these files out of the lcov report, Sonar does not find them there and
# counts their lines as uncovered. Changing a single wiring line therefore made the gate fail,
# whatever the quality of the rest of the pull request.
#
# The files listed are the ones standards/03-testing.md section 7 excludes: composition root, entry
# points, generated code, and the outbound adapters whose round trip cannot be exercised without a
# real PostgREST and a real broker. Their behaviour belongs to the integration tests (EN-25); what
# the relay and the consumer decide is tested against fakes.
sonar.coverage.exclusions=apps/api/src/composition-root.ts,apps/api/src/index.ts,apps/worker/src/index.ts,packages/data-migration/src/import-cli.ts,packages/data-migration/src/export-cli.ts,apps/api/src/openapi/write.ts,apps/web/src/main.tsx,packages/infra/src/database.types.ts,apps/web/src/hooks/view-state.ts,apps/web/src/hooks/items-state.ts,apps/web/src/hooks/notifications-state.ts,packages/infra/src/supabase-item-repository.ts,packages/infra/src/supabase-attention-reader.ts,packages/infra/src/supabase-personal-data-store.ts,packages/infra/src/supabase-project-repository.ts,packages/infra/src/supabase-membership-repository.ts,packages/infra/src/supabase-invitation-repository.ts,packages/infra/src/outbox-store.ts,packages/infra/src/notification-store.ts,packages/infra/src/redis-event-bus.ts,packages/infra/src/supabase-state-readings.ts,**/test/**
